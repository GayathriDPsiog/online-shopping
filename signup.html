<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up · OnlineShop</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">
  <header id="app-header"></header>

  <main class="container">
    <div class="auth-wrap">
      <div class="card">
        <h1>Create your account</h1>
        <p class="muted">It takes less than a minute.</p>
        <div class="form-error hidden" id="formError"></div>
        <form id="signupForm" novalidate>
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" autocomplete="name" placeholder="Subhash Kumar">
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="name@example.com">
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="mobile">Mobile number</label>
            <input type="tel" id="mobile" maxlength="10" inputmode="numeric" placeholder="9876543210">
            <div class="hint">10 digits, starting with 6, 7, 8 or 9.</div>
            <div class="field-error"></div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" autocomplete="new-password">
              <div class="field-error"></div>
            </div>
            <div class="field">
              <label for="confirm">Confirm password</label>
              <input type="password" id="confirm" autocomplete="new-password">
              <div class="field-error"></div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
        </form>
        <div class="auth-foot">Already have an account? <a href="login.html">Sign in</a></div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/services/cart.js"></script>
  <script src="js/services/customers.js"></script>
  <script src="js/pages/signup.js"></script>
</body>
</html>
