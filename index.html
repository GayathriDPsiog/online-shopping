<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop · OnlineShop</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
  <header id="app-header"></header>

  <main class="container">
    <section class="hero">
      <div>
        <h1>Find what you need</h1>
        <p>Browse by category, search, and check out with cash or store credit.</p>
      </div>
    </section>

    <div class="toolbar">
      <input type="search" id="search" class="grow" placeholder="Search products…" aria-label="Search products">
      <select id="catFilter" aria-label="Filter by category"><option value="">All categories</option></select>
      <select id="sort" aria-label="Sort">
        <option value="name">Name A–Z</option>
        <option value="priceAsc">Price: low to high</option>
        <option value="priceDesc">Price: high to low</option>
        <option value="newest">Newest first</option>
      </select>
      <span class="result-info" id="resultInfo"></span>
    </div>

    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/services/cart.js"></script>
  <script src="js/services/catalog.js"></script>
  <script src="js/pages/shop.js"></script>
</body>
</html>
