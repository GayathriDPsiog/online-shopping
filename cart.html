<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart · OnlineShop</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
  <header id="app-header"></header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Your cart</h1>
        <p class="muted">Prices and stock are re-checked when you open this page and again when you place the order.</p>
      </div>
      <a href="index.html" class="btn btn-ghost">‹ Continue shopping</a>
    </div>

    <div id="notices"></div>

    <div class="cart-layout">
      <div class="card" id="cartLines"></div>
      <div id="summary"></div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/services/cart.js"></script>
  <script src="js/services/catalog.js"></script>
  <script src="js/services/customers.js"></script>
  <script src="js/services/email.js"></script>
  <script src="js/services/orders.js"></script>
  <script src="js/pages/cart.js"></script>
</body>
</html>
