<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · OnlineShop</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <header id="app-header"></header>

  <main class="container">
    <div class="auth-wrap">
      <div class="card">
        <h1>Sign in</h1>
        <p class="muted">Welcome back. Sign in to check out and see your orders.</p>
        <div class="form-error hidden" id="formError"></div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="name@example.com">
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password">
            <div class="field-error"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign in</button>
        </form>
        <div class="auth-foot">
          <a href="reset-password.html">Forgot password?</a><br>
          New here? <a href="signup.html">Create an account</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/services/cart.js"></script>
  <script src="js/services/customers.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
