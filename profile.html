<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile · OnlineShop</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">
  <header id="app-header"></header>

  <main class="container" style="max-width:760px">
    <div class="page-head"><div><h1>My profile</h1><p class="muted">Update your name and mobile number.</p></div></div>

    <div class="card">
      <h2>Credit</h2>
      <div id="credit"></div>
    </div>

    <div class="card">
      <h2>Details</h2>
      <form id="profileForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" readonly>
          <div class="hint">Email cannot be changed.</div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name">
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="mobile">Mobile number</label>
            <input type="tel" id="mobile" maxlength="10" inputmode="numeric">
            <div class="field-error"></div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save changes</button>
      </form>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/services/cart.js"></script>
  <script src="js/services/customers.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
