<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers · Admin · OnlineShop</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="customers" data-root="../">
  <header id="app-header"></header>

  <main class="container">
    <div class="page-head">
      <div><h1>Customers</h1><p class="muted">Set credit limits and block or unblock accounts. New customers start with ₹0 credit.</p></div>
    </div>
    <div class="toolbar">
      <input type="search" id="search" class="grow" placeholder="Search name, email or mobile…" aria-label="Search customers">
      <select id="creditFilter" aria-label="Credit filter">
        <option value="">All customers</option>
        <option value="with">With credit</option>
        <option value="without">Without credit</option>
        <option value="blocked">Blocked</option>
      </select>
      <span class="result-info" id="resultInfo"></span>
    </div>
    <div id="list"></div>
    <div class="pager" id="pager"></div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/core/util.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/services/customers.js"></script>
  <script src="../js/pages/admin-customers.js"></script>
</body>
</html>
