<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Admin · OnlineShop</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="dashboard" data-root="../">
  <header id="app-header"></header>

  <main class="container">
    <div class="page-head">
      <div><h1>Dashboard</h1><p class="muted" id="today"></p></div>
      <div class="toolbar" style="margin:0">
        <button class="btn btn-ghost" id="seedBtn" title="Adds 10 categories and 184 products with real photos. Safe to run twice.">Load sample data</button>
        <a class="btn btn-ghost" href="products.html">Manage products</a>
        <a class="btn btn-primary" href="reports.html">Open reports</a>
      </div>
    </div>
    <div class="kpis" id="kpis">
    </div>
    <div class="two-col">
      <div class="card"><div class="section-title"><h2>Low stock</h2><a href="reports.html#inventory" class="small">View all</a></div><div id="lowStock"></div></div>
      <div class="card"><div class="section-title"><h2>Recent orders</h2><a href="reports.html#sales" class="small">View all</a></div><div id="recent"></div></div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/core/util.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/services/catalog.js"></script>
  <script src="../js/services/customers.js"></script>
  <script src="../js/services/cart.js"></script>
  <script src="../js/services/email.js"></script>
  <script src="../js/services/orders.js"></script>
  <script src="../js/services/reports.js"></script>
  <script src="../js/services/seed.js"></script>
  <script src="../js/pages/admin-dashboard.js"></script>
</body>
</html>
