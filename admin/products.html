<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products · Admin · OnlineShop</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="products" data-root="../">
  <header id="app-header"></header>

  <main class="container">
    <div class="page-head">
      <div><h1>Products (inventory)</h1><p class="muted">Create, update, activate/deactivate and delete items.</p></div>
      <button class="btn btn-primary" id="addBtn">+ Add product</button>
    </div>

    <div class="toolbar">
      <input type="search" id="search" class="grow" placeholder="Search by title…" aria-label="Search products">
      <select id="catFilter" aria-label="Category"><option value="">All categories</option></select>
      <select id="statusFilter" aria-label="Status">
        <option value="">Any status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="low">Low stock (&lt; 15)</option>
        <option value="high">High stock (&gt; 100)</option>
      </select>
      <span class="result-info" id="resultInfo"></span>
    </div>
    <div id="list"></div>
    <div class="pager" id="pager"></div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/core/util.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/services/catalog.js"></script>
  <script src="../js/pages/admin-products.js"></script>
</body>
</html>
