<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password · OnlineShop</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reset">
  <header id="app-header"></header>

  <main class="container">
    <div class="auth-wrap">
      <div class="card">
        <h1>Reset your password</h1>
        <p class="muted">Enter your account email and we'll send you a reset link.</p>
        <div class="notice notice-ok hidden" id="doneMsg"></div>
        <div class="form-error hidden" id="formError"></div>
        <form id="resetForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="name@example.com">
            <div class="field-error"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
        </form>
        <div class="auth-foot"><a href="login.html">Back to sign in</a></div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/services/cart.js"></script>
  <script src="js/pages/reset.js"></script>
</body>
</html>
